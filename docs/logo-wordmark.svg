<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <title>ChronoCare wordmark</title>
  <desc>ChronoCare logo with wordmark. Square icon on the left, serif wordmark on the right. For marketplace listing headers and README banners.</desc>

  <!-- Icon (scaled down to 256, positioned with 32px padding) -->
  <g transform="translate(32, 32)">
    <rect width="256" height="256" rx="48" ry="48" fill="#0f3a44"/>

    <defs>
      <pattern id="dotgrid2" width="16" height="16" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.5" fill="#f8f6f1" fill-opacity="0.04"/>
      </pattern>
    </defs>
    <rect width="256" height="256" rx="48" ry="48" fill="url(#dotgrid2)"/>

    <g stroke="#f8f6f1" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 5">
      <line x1="64" y1="40" x2="64" y2="216"/>
      <line x1="116" y1="40" x2="116" y2="216"/>
      <line x1="168" y1="40" x2="168" y2="216"/>
    </g>

    <path d="M 32 180 C 70 179, 100 170, 116 159 S 160 135, 179 115 S 216 76, 230 65"
          stroke="#f8f6f1"
          stroke-width="5"
          stroke-linecap="round"
          fill="none"/>

    <g>
      <circle cx="64" cy="177" r="13" fill="#1a5762" fill-opacity="0.20"/>
      <circle cx="64" cy="177" r="6.5" fill="#1a5762"/>

      <circle cx="116" cy="159" r="14" fill="#a86c14" fill-opacity="0.22"/>
      <circle cx="116" cy="159" r="7" fill="#a86c14"/>

      <circle cx="168" cy="115" r="15" fill="#9c2f2f" fill-opacity="0.24"/>
      <circle cx="168" cy="115" r="7.5" fill="#9c2f2f"/>
    </g>

    <line x1="220" y1="40" x2="220" y2="216"
          stroke="#f8f6f1" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Wordmark -->
  <text x="328" y="200"
        font-family="'Source Serif Pro', Georgia, 'Times New Roman', serif"
        font-weight="700"
        font-size="148"
        letter-spacing="-4"
        fill="#0e1622">Chrono<tspan fill="#0f3a44">Care</tspan></text>

  <!-- Tagline -->
  <text x="328" y="244"
        font-family="'Inter', -apple-system, sans-serif"
        font-weight="500"
        font-size="22"
        letter-spacing="3"
        fill="#5a6478">CLINICAL REASONING ON FHIR</text>
</svg>
